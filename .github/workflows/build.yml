# Runs the tests on every push and pull request. Pushing a version tag
# (e.g. v1.0.1) also builds a runnable jar on each platform, since each jar
# only contains JavaFX's native libraries for the OS it was built on, and
# attaches them to that tag's GitHub release.
#
# To build jars for a tag that already exists, run this workflow manually
# from the Actions tab and enter the tag.

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v1.0.0)
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # The phone formatter tests start JavaFX, which needs a display.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run ./mvnw -B test

  jar:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: mac-arm64
          - os: macos-15-intel
            platform: mac-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build jar
        shell: bash
        run: |
          ./mvnw -B clean package -DskipTests
          mkdir dist
          cp target/*-shaded.jar "dist/mailbox-manager-${TAG#v}-${{ matrix.platform }}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.platform }}
          path: dist/*.jar

  release:
    needs: jar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.jar --clobber
          else
            gh release create "$TAG" dist/*.jar --title "Mailbox Manager ${TAG#v}" --generate-notes
          fi
