# Runs the tests on every push and pull request.
#
# Pushing a version tag (e.g. v1.2.0) also builds, on each platform, an
# installer with Java bundled (Windows .msi, macOS .dmg, Linux .AppImage) plus
# the runnable jar, starts each installed app to check it launches, and
# attaches everything to that tag's GitHub release. Each platform is built on
# its own OS, since the files only contain JavaFX's native libraries for the
# OS they were built on.
#
# Run this workflow manually from the Actions tab to build the installers
# without a release (leave the tag empty; download them from the run's
# artifacts), or to build and release an existing tag (enter the tag).

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v1.2.0). Leave empty to only build the installers.
        required: false
        default: ''

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Several tests start JavaFX or open windows, which needs a display.
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run ./mvnw -B test
      # Start the release jar the way users do, to catch problems that don't
      # show up under Maven (such as the jar refusing to start on Java 21).
      # The app must still be running after 15 seconds.
      - name: Smoke-test the jar
        run: |
          ./mvnw -B -q package -DskipTests
          mkdir -p "$RUNNER_TEMP/home"
          xvfb-run java -Duser.home="$RUNNER_TEMP/home" -jar target/*-shaded.jar > jar.log 2>&1 &
          sleep 15
          if ! pgrep -f -- '-shaded.jar' > /dev/null; then
            echo "The jar exited during start-up:"
            cat jar.log
            exit 1
          fi
          pkill -f -- '-shaded.jar'

  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: mac-arm64
          - os: macos-15-intel
            platform: mac-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      # This Java is the one bundled into the installers.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check the tag matches the version in pom.xml
        if: env.RELEASE == 'true'
        shell: bash
        run: |
          version=$(sed -n 's|^    <version>\(.*\)</version>.*|\1|p' pom.xml | head -1)
          if [ "${TAG#v}" != "$version" ]; then
            echo "Tag $TAG does not match version $version in pom.xml"
            exit 1
          fi

      - name: Install WiX Toolset (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"
          "$USERPROFILE/.dotnet/tools/wix" extension add --global WixToolset.Util.wixext/5.0.2
          "$USERPROFILE/.dotnet/tools/wix" extension add --global WixToolset.UI.wixext/5.0.2

      # Builds made without these secrets work, but can't connect to Google Drive.
      - name: Add the Google client ID
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_CLIENT_ID isn't set, so this build can't back up to Google Drive."
            exit 0
          fi
          file=src/main/resources/org/lfps/mailboxes/drive/google-oauth.properties
          mkdir -p "$(dirname "$file")"
          printf 'client_id=%s\nclient_secret=%s\n' "$GOOGLE_CLIENT_ID" "$GOOGLE_CLIENT_SECRET" > "$file"

      - name: Build installer and jar
        shell: bash
        run: packaging/package.sh ${{ matrix.platform }}

      # Install and start each app the way users do; it must still be running
      # after 20 seconds.
      - name: Check the installed app starts (Windows)
        if: runner.os == 'Windows'
        env:
          # Use a throwaway data folder.
          JAVA_TOOL_OPTIONS: -Duser.home=${{ runner.temp }}/smoke-home
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist\*.msi).FullName
          $install = Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn /l*v install.log" -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            Write-Host "Install failed with exit code $($install.ExitCode):"
            Get-Content install.log -Tail 60
            exit 1
          }
          $exe = Join-Path $env:LOCALAPPDATA "Mailbox Manager\Mailbox Manager.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "Expected the app at $exe. Found:"
            Get-ChildItem $env:LOCALAPPDATA, $env:ProgramFiles -Recurse -Filter "Mailbox Manager.exe" -ErrorAction SilentlyContinue | ForEach-Object FullName
            exit 1
          }
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) {
            Write-Host "The app exited during start-up with exit code $($app.ExitCode)"
            exit 1
          }
          Stop-Process -Id $app.Id -Force

      - name: Check the installed app starts (macOS)
        if: runner.os == 'macOS'
        env:
          # Use a throwaway data folder.
          JAVA_TOOL_OPTIONS: -Duser.home=${{ runner.temp }}/smoke-home
        run: |
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" dist/*.dmg
          cp -R "$RUNNER_TEMP/dmg/Mailbox Manager.app" "$RUNNER_TEMP/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/Mailbox Manager.app/Contents/MacOS/Mailbox Manager" > app.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2> /dev/null; then
            echo "The app exited during start-up:"
            cat app.log
            exit 1
          fi
          kill "$pid"

      - name: Check the app starts (Linux)
        if: runner.os == 'Linux'
        env:
          # Use a throwaway data folder.
          JAVA_TOOL_OPTIONS: -Duser.home=${{ runner.temp }}/smoke-home
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          chmod +x dist/*.AppImage
          xvfb-run dist/*.AppImage --appimage-extract-and-run > app.log 2>&1 &
          sleep 20
          if ! pgrep -f 'bin/mailbox-manager' > /dev/null; then
            echo "The app exited during start-up:"
            cat app.log
            exit 1
          fi
          pkill -f 'bin/mailbox-manager'

      - uses: actions/upload-artifact@v7
        with:
          name: mailbox-manager-${{ matrix.platform }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "Mailbox Manager ${TAG#v}" --generate-notes
          fi
